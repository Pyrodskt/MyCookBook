<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MyCookBook{% endblock %}</title>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <nav class="bg-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <a href="{{ url_for('index') }}" class="text-2xl font-bold text-gray-800">MyCookBook</a>
            <div>
                {% if logged_in %}
                <a href="{{ url_for('logout') }}" class="text-gray-600 hover:text-gray-800 mx-2">Logout</a>
                {% else %}
                <a href="{{ url_for('login') }}" class="text-gray-600 hover:text-gray-800 mx-2">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container mx-auto mt-8 p-4">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
