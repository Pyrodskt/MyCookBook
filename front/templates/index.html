{% extends "layout.html" %}

{% block title %}Recipe Gallery{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold text-gray-800 mb-6">Our Recipes</h1>

<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
    {% for recipe in recipes %}
    <div class="recipe-card bg-white rounded-lg shadow-md overflow-hidden cursor-pointer transform transition duration-300 hover:scale-105"
         data-id="{{ recipe.id }}"
         data-title="{{ recipe.title }}"
         data-image="{{ recipe.image }}"
         data-ingredients="{{ recipe.ingredients | join('||') }}"
         data-instructions="{{ recipe.instructions | join('||') }}">
        <img src="{{ recipe.image }}" alt="{{ recipe.title }}" class="w-full h-48 object-cover">
        <div class="p-4">
            <h2 class="text-xl font-semibold text-gray-800">{{ recipe.title }}</h2>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Recipe Detail Modal -->
<div id="recipeModal" class="fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 hidden">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-2xl max-h-[90vh] overflow-y-auto relative">
        <button id="closeModal" class="absolute top-3 right-3 text-gray-500 hover:text-gray-800 text-2xl font-bold">&times;</button>
        <img id="modalImage" src="" alt="" class="w-full h-64 object-cover rounded-md mb-4">
        <h2 id="modalTitle" class="text-3xl font-bold text-gray-800 mb-4"></h2>
        
        <div class="mb-6">
            <h3 class="text-2xl font-semibold text-gray-700 mb-2">Ingredients:</h3>
            <ul id="modalIngredients" class="list-disc list-inside text-gray-600">
            </ul>
        </div>
        
        <div>
            <h3 class="text-2xl font-semibold text-gray-700 mb-2">Instructions:</h3>
            <ol id="modalInstructions" class="list-decimal list-inside text-gray-600">
            </ol>
        </div>
    </div>
</div>
{% endblock %}
